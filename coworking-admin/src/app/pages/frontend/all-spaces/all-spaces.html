<main class="main-content">
  <!-- Left: Listing -->
  <section class="listing-section">
    <div class="listing-section__search-bar">
      <div class="search-group">
        <div class="search-group__item">
          <span class="material-symbols-outlined">search</span>
          <input type="text" placeholder="地點" />
        </div>
        <div class="search-group__item">
          <span class="material-symbols-outlined">calendar_today</span>
          <input type="text" placeholder="時間" />
        </div>
        <div class="search-group__item" style="max-width: 120px;">
          <span class="material-symbols-outlined">person</span>
          <select>
            <option>1-60+</option>
          </select>
        </div>
        <button class="search-group__submit">搜尋</button>
      </div>
      <div class="filters">
        <button class="filters__btn">
          價格 <span class="material-symbols-outlined">expand_more</span>
        </button>
        <button class="filters__btn">
          <span class="material-symbols-outlined">tune</span> 地區篩選
        </button>
      </div>
    </div>

    <div class="listing-section__feed">
      <p class="listing-info">已顯示可租用空間 總共 368 個空間</p>
      <div class="card-grid">
        <article class="card" *ngFor="let space of spaces">
          <div class="card__image-wrapper">
            <img [src]="space.img" [alt]="space.name" />
            <span class="card__badge">{{ space.capacity }}</span>
          </div>
          <div class="card__content">
            <div>
              <h3 class="card__title">{{ space.name }}</h3>
              <p class="card__location">{{ space.location }}</p>
              <p class="card__price">NT$ {{ space.price }} / 月起</p>
            </div>
            <button class="card__fav">
              <span class="material-symbols-outlined">favorite_border</span>
            </button>
          </div>
        </article>
      </div>

      <div class="pagination">
        <button class="pagination__btn pagination__btn--border">
          <span class="material-symbols-outlined">chevron_left</span>
        </button>
        <button class="pagination__btn pagination__btn--active">1</button>
        <button class="pagination__btn">2</button>
        <button class="pagination__btn">3</button>
        <span class="pagination__btn">...</span>
        <button class="pagination__btn">8</button>
        <button class="pagination__btn pagination__btn--border">
          <span class="material-symbols-outlined">chevron_right</span>
        </button>
      </div>
    </div>
  </section>

  <!-- Right: Map -->
  <aside class="map-section">
    <img
      src="https://api.mapbox.com/styles/v1/mapbox/light-v10/static/121.54,25.04,13.5,0/1280x1280?access_token=pk.eyJ1IjoibWFwYm94IiwiYSI6ImNpejY4NXVycTAwMHozN243YXN2Y3NseGkifQ.0X6_8_d4_x4X4X4X4X4X4X"
      class="map-section__img" alt="Map" />
    <div class="map-section__overlay">
      <div class="map-section__toggle-wrapper">
        <div class="map-section__toggle">
          <span>地圖</span>
          <div class="switch"></div>
        </div>
      </div>
      <div class="map-section__pin map-section__pin--1">336</div>
      <div class="map-section__pin map-section__pin--2">23</div>
      <div class="map-section__pin map-section__pin--3">9</div>
      <button class="map-section__fab">
        <span class="material-symbols-outlined">my_location</span>
      </button>
    </div>
  </aside>
</main>
