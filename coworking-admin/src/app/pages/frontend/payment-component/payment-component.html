<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WorkspaceCollective Booking</title>
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="/src/styles/style.scss" />
</head>
<!-- Main Content -->
<main class="container main-content">
  <!-- Left Column: Form -->
  <div class="form-section">
    <div class="section-header">
      <h1>結帳預訂</h1>
      <p>請填寫您的付款資訊以完成專屬固定辦公桌預訂。</p>
    </div>

    <section class="contact-section form-group">
      <h2>日期資訊</h2>
      <div class="inputs">
        <div class="date-picker">
          <div class="date-field">
            <label for="startDate">開始日期</label>
            <div class="input-wrapper date-input">
              <input id="startDate" name="startDate" type="date" aria-label="開始日期" [min]="today"
                (change)="onStartDateChange($event)">
            </div>
          </div>
          <span class="date-separator">～</span>
          <div class="date-field">
            <label for="endDate">結束日期</label>
            <div class="input-wrapper date-input">
              <input id="endDate" name="endDate" type="date" aria-label="結束日期" [min]="startDate || today"
                (change)="onEndDateChange($event)">
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- Invoice Info -->
    <section class="invoice-section">
      <h2>發票資訊</h2>
      <div class="form-group row">
        <div>
          <label>發票類型</label>
          <div class="input-wrapper">
            <select [value]="invoiceType" (change)="onInvoiceTypeChange($event)">
              <option value="personal">二聯式 (個人)</option>
              <option value="company">三聯式 (公司戶)</option>
            </select>
          </div>
        </div>
        @if (invoiceType === 'company') {
          <div class="company-invoice-fields">
            <div>
              <label>公司名稱</label>
              <div class="input-wrapper">
                <input type="text" placeholder="請輸入公司名稱" />
              </div>
            </div>
            <div>
              <label>統一編號</label>
              <div class="input-wrapper">
                <input type="text" placeholder="請輸入統一編號" />
              </div>
            </div>
          </div>
        }
      </div>
    </section>

    <!-- Billing Address -->
    <section class="billing-section">
      <h2>帳單地址</h2>
      <div class="form-group">
        <label>街道地址</label>
        <div class="input-wrapper">
          <input type="text" placeholder="請輸入街道、門牌" />
        </div>
      </div>
      <div class="form-group row">
        <div>
          <label>城市</label>
          <div class="input-wrapper">
            <select>
              <option>台北市</option>
              <option>新北市</option>
              <option>台中市</option>
            </select>
          </div>
        </div>
        <div>
          <label>郵遞區號</label>
          <div class="input-wrapper">
            <input type="text" placeholder="100" />
          </div>
        </div>
      </div>
    </section>

    <!-- Trust Badges -->
    <div class="trust-badges">
      <div class="badge">
        <i data-lucide="shield-check"></i>
        <span>SSL 安全加密</span>
      </div>
      <div class="badge">
        <i data-lucide="shield"></i>
        <span>256 位元資料保護</span>
      </div>
      <div class="badge">
        <i data-lucide="history"></i>
        <span>24小時取消政策</span>
      </div>
    </div>
  </div>

  <!-- Right Column: Sidebar -->
  <aside class="sidebar">
    <div class="summary-card">
      <div class="hero-img">
        <img src="https://images.unsplash.com/photo-1497366216548-37526070297c?auto=format&fit=crop&q=80&w=600"
          alt="Workspace" />
        <div class="tag">專屬固定辦公桌</div>
      </div>
      <div class="summary-details">
        <h3>訂單摘要</h3>
        <p class="item-name">專屬固定辦公桌 - 玻璃中庭</p>
        <div class="date-range">
          <i data-lucide="calendar"></i>
          <span>2024/11/01 - 2024/11/30</span>
        </div>

        <div class="price-breakdown">
          <div class="line-item">
            <span>小計</span>
            <span>NT$ 18,500</span>
          </div>
          <div class="line-item">
            <span>稅額 (5%)</span>
            <span>NT$ 925</span>
          </div>
          <div class="line-item discount">
            <span>折扣 (秋季優惠)</span>
            <span>- NT$ 1,500</span>
          </div>
        </div>

        <div class="total-row">
          <span>總計</span>
          <span class="total-price">NT$ 17,925</span>
        </div>

        <button class="btn-confirm" (click)="booking()">
          確認預訂
          <i data-lucide="arrow-right"></i>
        </button>

        <p class="disclaimer">
          點擊確認付款即表示您同意我們的服務條款與隱私政策。
        </p>
      </div>
    </div>
  </aside>
</main>
