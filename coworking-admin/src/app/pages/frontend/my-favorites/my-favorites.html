<div class="favorites-page">
  <div class="container">

    <!-- HEADER -->
    <header class="page-header">
      <h1 class="page-title">我的收藏</h1>
      <p class="subtitle">
        共收藏 {{ favorites.length }} 個空間
      </p>
    </header>

    <!-- EMPTY STATE -->
    @if (favorites.length === 0) {
      <section class="empty-state">
        <div class="empty-icon material-symbols-outlined">
          favorite
        </div>

        <h3 class="empty-title">尚未收藏任何空間</h3>

        <p class="empty-desc">
          立即搜尋探索，點選愛心收藏您喜歡的空間！
        </p>
      </section>
    } @else {

    <!-- LIST -->
    <section class="favorite-list">

      @for (space of favorites; track space.space_id) {
      <article class="favorite-card">

        <!-- LEFT / INFO -->
        <div class="card-main">

          <div class="card-header">
            <h3 class="space-number">
              {{ space.space_number }}
            </h3>

            <span class="capacity-badge">
              {{ space.capacity ?? '未知' }} 人
            </span>
          </div>

          <p class="card-desc">
            登入會員，立即預訂！
          </p>

        </div>

        <!-- ACTION -->
        <div class="card-actions">

          <a
            class="btn-detail"
            [routerLink]="['/space-detail', space.space_id]">
            查看詳情
          </a>

          <button
            class="btn-remove"
            (click)="removeFavorite(space.space_id)">
            <span class="material-symbols-outlined">favorite</span>
          </button>

        </div>

      </article>
      }

    </section>
    }

  </div>
</div>
