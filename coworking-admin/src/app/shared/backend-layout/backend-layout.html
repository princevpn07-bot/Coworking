<div class="admin-wrapper" [class.dark]="isDark">
  <aside class="sidebar">
    <div class="sidebar-header">
      <h1 class="brand-logo">COVO Admin</h1>
      <p class="brand-subtext">企業管理控制台</p>
    </div>
    <nav class="sidebar-nav">
      <a class="nav-item" routerLink="/backend/dashboard" routerLinkActive="active">
        <span class="material-symbols-outlined">dashboard</span>
        儀表板
      </a>
      <a class="nav-item" routerLink="/backend/bookings" routerLinkActive="active">
        <span class="material-symbols-outlined">calendar_month</span>
        預訂與日曆
      </a>
      <a class="nav-item" routerLink="/backend/spaces" routerLinkActive="active">
        <span class="material-symbols-outlined">layers</span>
        空間與資產
      </a>
      @if (!isPartner) {
        <a class="nav-item" routerLink="/backend/resources" routerLinkActive="active">
          <span class="material-symbols-outlined">inventory_2</span>
          資源調配
        </a>
      }
      @if (!isPartner) {
        <a class="nav-item" routerLink="/backend/members" routerLinkActive="active">
          <span class="material-symbols-outlined">group</span>
          成員與公司
        </a>
      }

    </nav>
    <div class="sidebar-footer">
      <!-- <a class="user-profile" routerLink="/backend/profile" routerLinkActive="active">
        <span class="material-symbols-outlined">account_circle</span>
        個人資料
      </a> -->
      <a class="user-profile" routerLink="/">
        <span class="material-symbols-outlined">home</span>
        返回前台
      </a>
      <a class="logout-link" (click)="logout()">
        <span class="material-symbols-outlined">logout</span>
        登出
      </a>
    </div>
  </aside>
  <div class="main-content">
    <header class="top-header">
      <h2 class="page-title">{{ pageTitle }}</h2>
      <div class="header-right">
        <button class="theme-toggle" (click)="toggleDark()" [title]="isDark ? '切換亮色模式' : '切換暗色模式'">
          <span class="material-symbols-outlined">{{ isDark ? 'light_mode' : 'dark_mode' }}</span>
        </button>
        <div class="current-time">
          <span class="material-symbols-outlined">schedule</span>
          {{ currentTime }}
        </div>
      </div>
    </header>
    <main>
      <router-outlet />
    </main>
  </div>
</div>
