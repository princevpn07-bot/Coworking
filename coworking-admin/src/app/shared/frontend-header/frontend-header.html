<nav class="navbar">
  <div class="container">
    <a class="logo" routerLink="/">WorkspaceCollective</a>
    <div class="nav-links">
      <a routerLink="/all-spaces" routerLinkActive="active">瀏覽空間</a>
      <a href="#">解決方案</a>
      <a href="#">企業方案</a>
      <a href="#">關於我們</a>
    </div>
    <div class="header-actions">

      <!-- 未登入 -->
      <ng-container *ngIf="!isLoggedIn">
        <button class="btn-login" routerLink="/login">登入</button>
        <button class="btn-book" routerLink="/all-spaces">立即預訂</button>
      </ng-container>

      <!-- 已登入 -->
      <ng-container *ngIf="isLoggedIn">
        <button class="btn-book" routerLink="/all-spaces">立即預訂</button>
        <div class="user-menu">
          <button class="user-avatar-btn" (click)="toggleDropdown()">
            <span class="avatar-circle">{{ avatarInitial }}</span>
            <span class="welcome-text">歡迎，{{ username }}</span>
            <span class="chevron" [class.open]="showDropdown">&#8964;</span>
          </button>
          <div class="dropdown-menu" *ngIf="showDropdown">
            <a class="dropdown-item" routerLink="/my-orders" (click)="showDropdown=false">
              <span class="item-icon">📋</span>訂單紀錄
            </a>
            <div class="dropdown-divider"></div>
            <button class="dropdown-item logout-item" (click)="logout()">
              <span class="item-icon">🚪</span>登出
            </button>
          </div>
        </div>
      </ng-container>

    </div>
  </div>
</nav>
